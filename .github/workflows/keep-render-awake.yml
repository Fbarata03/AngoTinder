name: Keep Render Awake

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: []

jobs:
  ping-render:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render health endpoint
        run: |
          echo "Pinging Render backend to keep it awake..."
          curl -fsS https://angotinder.onrender.com/api/health || echo "Render ping failed, continuing anyway."
