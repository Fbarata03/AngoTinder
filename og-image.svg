<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#CE1126"/>
      <stop offset="50%" style="stop-color:#8B0000"/>
      <stop offset="100%" style="stop-color:#000000"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FFCD00"/>
      <stop offset="100%" style="stop-color:#FFA500"/>
    </linearGradient>
  </defs>

  <!-- Fundo -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Padrão decorativo -->
  <circle cx="100" cy="100" r="200" fill="#FFCD00" opacity="0.05"/>
  <circle cx="1100" cy="530" r="250" fill="#FFCD00" opacity="0.05"/>
  <circle cx="600" cy="630" r="300" fill="#CE1126" opacity="0.1"/>

  <!-- Coração central -->
  <g transform="translate(420, 140)">
    <path d="M 180 280 C 180 280 20 200 20 100 C 20 45 60 10 110 10 C 140 10 165 25 180 50 C 195 25 220 10 250 10 C 300 10 340 45 340 100 C 340 200 180 280 180 280 Z"
          fill="url(#gold)" opacity="0.95"/>
  </g>

  <!-- Barra dourada decorativa -->
  <rect x="0" y="0" width="1200" height="8" fill="url(#gold)"/>
  <rect x="0" y="622" width="1200" height="8" fill="url(#gold)"/>

  <!-- Texto principal -->
  <text x="600" y="390" font-family="Arial Black, Arial, sans-serif" font-size="88" font-weight="900"
        fill="white" text-anchor="middle" letter-spacing="2">AngoTinder</text>

  <!-- Linha dourada -->
  <rect x="350" y="415" width="500" height="4" rx="2" fill="url(#gold)"/>

  <!-- Subtítulo -->
  <text x="600" y="470" font-family="Arial, sans-serif" font-size="34" font-weight="700"
        fill="#FFCD00" text-anchor="middle">O App de Encontros de Angola</text>

  <!-- Texto inferior -->
  <text x="600" y="530" font-family="Arial, sans-serif" font-size="24"
        fill="rgba(255,255,255,0.7)" text-anchor="middle">Luanda · Benguela · Huambo · Todo o País</text>

  <!-- URL -->
  <text x="600" y="580" font-family="Arial, sans-serif" font-size="20"
        fill="rgba(255,205,0,0.8)" text-anchor="middle">angotinder.bafly.net</text>
</svg>
