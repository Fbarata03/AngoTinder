<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Fundo redondo com gradiente vermelho Angola -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#CE1126"/>
      <stop offset="100%" style="stop-color:#8B0000"/>
    </linearGradient>
    <linearGradient id="heart" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFCD00"/>
      <stop offset="100%" style="stop-color:#FFA500"/>
    </linearGradient>
  </defs>

  <!-- Círculo de fundo -->
  <circle cx="256" cy="256" r="256" fill="url(#bg)"/>

  <!-- Coração dourado -->
  <path d="M256 380 C256 380 120 290 120 195 C120 150 155 115 200 115 C225 115 248 128 256 145 C264 128 287 115 312 115 C357 115 392 150 392 195 C392 290 256 380 256 380Z"
        fill="url(#heart)"
        filter="drop-shadow(0 4px 12px rgba(255,205,0,0.5))"/>

  <!-- Letra A branca no centro do coração -->
  <text x="256" y="265" font-family="Arial Black, sans-serif" font-size="110" font-weight="900"
        fill="#000000" text-anchor="middle" dominant-baseline="middle">A</text>
</svg>
